name: Validate

on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: false
        type: string
        default: ''
      upload_build:
        description: Save the production build tested on Windows for release packaging
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:release
      - run: pnpm test:coverage
      - run: pnpm test:stress
      - run: pnpm smoke:kernel
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.upload_build }}
        with:
          name: release-build
          overwrite: true
          path: |
            out/main/
            out/preload/
            out/renderer/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-reports
          overwrite: true
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 14

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm test
      - run: pnpm test:stress
